# Keep-alive ל-Render (חינמי) — מונע cold start של 30-60 שניות.
# Render מרדים את השירות אחרי ~15 דקות בלי תנועה; פינג כל 5 דקות משאיר אותו ער.
#
# רץ 24/7 (מ-20/07/2026): הביקורת של אפל נכשלה על "blank login screen" — הבודקים
# בקליפורניה עובדים בדיוק בחלון הלילה הישראלי שבו השרת נרדם (01:00-06:00 IL =
# 15:00-20:00 PT), וקיבלו cold start של 30-60 ש'. 24/7 = ~744 שעות instance
# בחודש — עדיין בתוך 750 החינמיות של Render (בהנחה שזה השירות היחיד בחשבון).
# היעד: / — עונה מחרוזת סטטית, בלי Apps Script ובלי DB. עלות אפס לשרת.
#
# הערה: cron של GitHub Actions לעיתים מתעכב בכמה דקות — מספיק טוב לחלון של 15 דקות.
# אם יתגלו הירדמויות בכל זאת: UptimeRobot/cron-job.org (חינמי, מדויק יותר).
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # הפעלה ידנית מה-Actions tab לבדיקה

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://remax-bot.onrender.com/ || echo "000")
          echo "ping → HTTP $code"
          # גם תשובת שגיאה מעירה את השירות — לא מפילים את ה-job על קוד לא-200
